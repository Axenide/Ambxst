# PAM configuration for Ambxst[+] lockscreen
# nullok removed: empty passwords must never authenticate.
# Account lockout is handled in LockScreen.qml via the `faillock` CLI;
# a pam_faillock.so stack cannot be used here because the module is not
# present on all target systems (NixOS) — a missing required module would
# break unlock entirely.
auth sufficient pam_fprintd.so max-tries=3 timeout=30
auth required pam_unix.so try_first_pass
